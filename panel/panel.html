<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Flow AI Video Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="../icons/icon32.png" alt="logo" />
      <div>
        <h1>Flow AI Video</h1>
        <span id="connBadge" class="badge badge-idle">● idle</span>
      </div>
    </div>
  </header>

  <!-- 1. API Key -->
  <section class="card">
    <h2>1. API Key DeepSeek</h2>
    <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
    <div id="keyStatus" class="muted"></div>
  </section>

  <!-- 2. Konten -->
  <section class="card">
    <h2>2. Konten</h2>
    <div class="row">
      <label class="opt">Preset
        <select id="presetSelect"></select>
      </label>
      <label class="opt check">
        <input type="checkbox" id="syariToggle" /> Mode Syar'i
      </label>
    </div>
    <label>Deskripsi subjek / produk (konsistensi — DeepSeek tak baca gambar)
      <textarea id="subjectDesc" rows="3" placeholder="cth: botol skincare lokal, hijau, cap khas, tekstur gel..."></textarea>
    </label>
    <label>Narasi lengkap (opsional — akan dibagi per shot, format Video_Prompt_Final)
      <textarea id="narration" rows="4" placeholder="Tempel naskah narasi utuh di sini. Kosongkan biar DeepSeek menulis sendiri.&#10;cth: Halo semuanya! Hari ini kita makan siang spesial—ayam goreng kriuk..."></textarea>
    </label>
    <div class="row">
      <label class="opt">Jumlah shot
        <input type="number" id="shotCount" min="1" max="20" value="8" />
      </label>
      <label class="opt">Durasi (dtk)
        <input type="number" id="shotDuration" min="4" max="15" value="10" />
      </label>
    </div>
    <label class="opt">Prompt yang dikirim ke Flow
      <select id="optPromptMode">
        <option value="motion" selected>Motion-only (ringkas — butuh image reference)</option>
        <option value="full">Deskriptif lengkap (visual+kamera+efek — tanpa gambar)</option>
      </select>
    </label>
    <button id="btnGenerate" class="primary">✨ Generate Prompt</button>
  </section>

  <!-- 3. Image Reference + Rasio -->
  <section class="card">
    <h2>3. Image Reference &amp; Rasio</h2>
    <input type="file" id="imageFile" accept="image/*" />
    <div id="imagePreview" class="preview hidden"></div>
    <div class="row" style="margin-top:10px">
      <label class="opt">Rasio video (setelan Flow)
        <select id="optRatio">
          <option value="9:16" selected>9:16 (portrait)</option>
          <option value="16:9">16:9 (landscape)</option>
        </select>
      </label>
      <label class="opt">Mode output (garansi vertikal)
        <select id="optOutput">
          <option value="crop" selected>Vertikal 9:16 (crop)</option>
          <option value="both">Asli + Vertikal</option>
          <option value="flow">Asli saja</option>
        </select>
      </label>
    </div>
    <div class="row between" style="margin-top:4px">
      <label class="opt check" style="flex-direction:row;align-items:center;gap:6px;margin:0">
        <input type="checkbox" id="optApplyRatio" checked /> Terapkan ke Setelan agen Flow sebelum batch
      </label>
      <button id="btnCheckSettings" class="ghost">🔍 Cek Setelan</button>
    </div>
  </section>

  <!-- 4. Shot list -->
  <section class="card" id="shotsCard" hidden>
    <h2>4. Daftar Shot</h2>
    <div class="row between">
      <button id="btnBatch" class="primary">▶ Mulai Batch di Flow</button>
      <button id="btnStop" class="ghost" disabled>⏹ Stop</button>
    </div>
    <div class="row between" style="margin-top:8px">
      <button id="btnCopyScript" class="ghost">📋 Salin Script (.txt)</button>
      <span id="shotCountInfo" class="muted"></span>
    </div>
    <div id="shotList" class="shot-list"></div>
  </section>

  <!-- 5. Log -->
  <section class="card">
    <h2>Log</h2>
    <div id="log" class="log"></div>
  </section>

  <footer class="muted">
    Buka tab Google Flow (labs.google/fx) lalu klik "Mulai Batch".
    Panel boleh tetap terbuka selama batch berjalan.
  </footer>

  <script src="../config/presets.js"></script>
  <script src="panel.js"></script>
</body>
</html>
